name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r server/requirements-dev.txt
        working-directory: .
      - name: Lint
        run: ruff check server sdk
      - name: SDK tests
        run: python -m pytest sdk/tests -q
      - name: Server tests
        run: python -m pytest -q
        working-directory: server
        env:
          POSTGRES_HOST: localhost

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck + build
        run: npm run build
        working-directory: web
