server {
    listen 80;

    # Docker's embedded DNS. Resolving the upstream through a *variable* forces
    # nginx to re-resolve per request instead of caching the container IP at
    # startup — without this, recreating the api container (e.g. `docker compose
    # up` after an .env change) leaves nginx pinned to a dead IP and every
    # request 502s until the frontend is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $argus_api api:8000;
        proxy_pass http://$argus_api$request_uri;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        # Retry the next upstream address if the first connection fails.
        proxy_next_upstream error timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # index.html must never be cached, or a rebuilt SPA keeps serving stale
        # asset hashes; the hashed assets themselves are immutable.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }
}
